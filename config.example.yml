hosts:
  default:
    username: user
    password: pass
  # 192.168.100.1:
  #   username: different_user
  #   password: different_pass
groups:
  group1:
    username: group1_user
    password: group1_pass
# loglevel can be one of "debug", "info", "warn", "error"
loglevel: info

# The modules map defines various collectors the exporter may use, at client discretion.
# Clients like Prometheus should specify one or more 'modules' HTTP query parameters
# for each scrape, mapping to one or more of the defined modules below.
# Clients requesting a module which does not exist in this map, will not receive metrics
# beyond internal telemetry.
modules:
  chassis:
    prober: chassis_collector
    chassis_collector:
      # A GB300 tray publishes 144 per-core CPU utilisation sensors, more series than the
      # rest of this collector produces for that tray combined, and node_exporter already
      # reports the same thing in-band at higher resolution. Drop the pattern to collect
      # them. This trims series only — the sensors arrive in the same single request.
      sensor_exclude: "_CoreUtil_[0-9]+$"
  # A leak-detection-only chassis scrape, cheap enough to poll on a short interval.
  # Coolant leaks on liquid-cooled hardware are a minutes-matter event, so this exists to
  # be scraped far more frequently than a full chassis scrape allows.
  leak_detection:
    prober: chassis_collector
    chassis_collector:
      # Disabling both legacy schemas also narrows the Sensors pass to the leak detectors.
      # Without that, on the liquid-cooled platforms this module targets — where no chassis
      # implements Thermal or Power — Sensors would stand in for what was just disabled.
      disable_thermal: true
      disable_power: true
      disable_network_adapters: true
      # Optional and vendor specific, but worth setting: it is the difference between
      # walking every chassis and walking only the one that carries detectors.
      # Supermicro NVL72 compute tray:
      # chassis_include: "^Chassis_[0-9]+$"
      # MGX NVSwitch tray:
      # chassis_include: "^MGX_BMC_[0-9]+$"
  gpu:
    prober: gpu_collector
  manager:
    prober: manager_collector
  system:
    prober: system_collector
  telemetry:
    prober: telemetry_collector
